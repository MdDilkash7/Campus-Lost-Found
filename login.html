{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><h2>Welcome Back</h2><p class="text-muted">Login to your campus account.</p>
<form method="post"><label>Email</label><input class="form-control mb-3" type="email" name="email" required>
<label>Password</label><input class="form-control mb-4" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 text-center">New user? <a href="{{url_for('register')}}">Create account</a></p></div></div>{% endblock %}
